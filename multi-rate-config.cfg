[luigi_core]
local_scheduler = true
log_level = INFO

[luigi_base]
ifos = ["H1", "L1"]
# strain generation parameters
start = 1240624412
end = 1240644412
flag = DATA 
channels =  &::ifos
seed = 1122
sample_rate = 2048


[luigi_A3D3Dataset]
mass_pairs = [[10, 10], [20, 10], [20, 20], [35, 20], [35, 35], [50, 50]]
zmax = 0.3
prior = priors.a3d3.prior

sample_rate = &::luigi_base::sample_rate
kernel_length = 24
num_background_samples = 100_000
signal_right_pad = 1

[luigi_TrainingWaveforms]
workflow = htcondor
num_jobs = 1
num_signals = 50_000
waveform_approximant = IMRPhenomPv2
waveform_duration = 8
minimum_frequency = 20
reference_frequency = 50
coalescence_time = 6
request_memory = 24Gb

[luigi_Fetch]
workflow = htcondor
start = &::luigi_base::start
end = &::luigi_base::end
sample_rate = &::luigi_base::sample_rate
min_duration = 15000
max_duration = 20000
ifos = &::luigi_base::ifos
flag = &::luigi_base::flag
channels = &::luigi_base::channels
request_memory = 6GB
request_disk = 1024KB
request_cpus = 1

